[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.139.2",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "logging>=0.4.9.6",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "accelerate>=1.0.0",
    "pillow>=10.0.0",
    "pymilvus[model]>=3.0.0",
    "modelscope>=1.38.1",
    "logger>=1.4",
    "openai-agents>=0.19.1",
    "dashscope>=1.26.5",
    "uvicorn[standard]>=0.52.0",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
